[project]
name = "odswriter"
version = "0.5.0"
description = "A pure-Python module for writing OpenDocument spreadsheets (similar to csv.writer)."
authors = [
    {name = "Michael Mulqueen", email = "michael@mulqueen.me.uk"}
]
license = "MIT"
license-files = ["LICENSE.txt"]
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
keywords = ["opendocument", "spreadsheet", "ods", "libreoffice"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
]

[project.urls]
Homepage = "https://github.com/mmulqueen/odswriter"
Repository = "https://github.com/mmulqueen/odswriter"
Issues = "https://github.com/mmulqueen/odswriter/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["odswriter"]
